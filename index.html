<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Q&A & Challenge Hub - Final AI Level System</title>
    <style>
        /* Default Pink Theme (Girls) */
        :root {
            --primary: #db2777;
            --primary-hover: #be185d;
            --bg-color: #fdf2f8;
            --card-bg: #ffffff;
            --text-color: #831843;
            --text-light: #9d174d;
            --border-color: #f472b6;
            --btn-gradient: linear-gradient(135deg, #db2777 0%, #be185d 100%);
        }

        /* Dark & Red Theme (Boys) */
        [data-theme="boy"] {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-light: #94a3b8;
            --border-color: #ef4444;
            --btn-gradient: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Welcome & Validation Screen Overlay */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .welcome-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .welcome-card h2 {
            color: #db2777;
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .welcome-card input, .welcome-card select {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            color: #1e293b;
            background: #f8fafc;
        }
