<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Q&A & Student Story Hub</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2.3rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 12px 28px;
            background-color: #e2e8f0;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-light);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 6px 12px -2px rgba(79, 70, 229, 0.4);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Card */
        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 2px solid #e2e8f0;
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            background-color: #f8fafc;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        .ai-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .ai-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        /* Feed & Post Cards */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
            border: 2px solid #e2e8f0;
            transition: transform 0.3s;
        }

        .post-card:hover {
            transform: translateY(-3px);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .post-author {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .post-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0 0 20px 0;
            color: #0f172a;
        }

        /* 3 Fun Vertical Cards Layout inside Feed */
        .fun-boxes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Fully Colored Vibrant Boxes for Kids/Students */
        .box-summary {
            background: linear-gradient(135deg, #e0f2fe 100%, #bae6fd 0%);
            border: 2px solid #7dd3fc;
            border-left: 8px solid #0284c7;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
            transition: transform 0.2s;
        }

        .box-summary:hover {
            transform: scale(1.01);
        }

        .box-def {
            background: linear-gradient(135deg, #dcfce7 100%, #bbf7d0 0%);
            border: 2px solid #86efac;
            border-left: 8px solid #16a34a;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.1);
            transition: transform 0.2s;
        }

        .box-def:hover {
            transform: scale(1.01);
        }

        .box-detail {
            background: linear-gradient(135deg, #fae8ff 100%, #f5d0fe 0%);
            border: 2px solid #e879f9;
            border-left: 8px solid #c026d3;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(192, 38, 211, 0.1);
            transition: transform 0.2s;
        }

        .box-detail:hover {
            transform: scale(1.01);
        }

        .box-heading {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .box-summary .box-heading { color: #0369a1; }
        .box-def .box-heading { color: #15803d; }
        .box-detail .box-heading { color: #86198f; }

        .box-content {
            color: #334155;
            line-height: 1.7;
            font-size: 1rem;
            font-weight: 500;
            white-space: pre-line;
        }

        .story-text {
            background-color: #fef3c7;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #fde68a;
            border-left: 8px solid #d97706;
            color: #78350f;
            line-height: 1.7;
            font-weight: 500;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: 30px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚀 Fun Smart AI Q&A & Student Hub</h1>
            <p>Explore colorful, exciting AI-generated notes designed specially for students!</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('qa')">💡 AI Q&A Portal</button>
            <button class="tab-btn" onclick="switchTab('story')">✍️ Share Story</button>
        </div>

        <!-- TAB 1: AI Q&A PORTAL -->
        <div id="qa-tab" class="tab-content active">
            <div class="card">
                <h2>✨ Ask Question & Generate Fun AI Answer</h2>
                <div class="form-group">
                    <label for="qa-name">Your Name:</label>
                    <input type="text" id="qa-name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="qa-title">Question / Topic:</label>
                    <input type="text" id="qa-title" placeholder="e.g., Introduction to Data Science, Python Libraries">
                </div>
                <button class="ai-btn" onclick="generateAIAnswer()">✨ Generate Magical AI Answer</button>

                <div id="ai-result-area" style="margin-top: 25px; display: none;">
                    <hr style="border: 0; border-top: 2px solid #e2e8f0; margin-bottom: 20px;">
                    <h3 style="color: #059669; margin-bottom: 15px;">🎉 Generated AI Structured Answer:</h3>
                    
                    <div class="form-group">
                        <label>1. Quick Summary / Short Notes:</label>
                        <textarea id="qa-summary"></textarea>
                    </div>
                    <div class="form-group">
                        <label>2. Definitions & Key Terms:</label>
                        <textarea id="qa-def"></textarea>
                    </div>
                    <div class="form-group">
                        <label>3. Detailed Explanation:</label>
                        <textarea id="qa-detail"></textarea>
                    </div>
                    <button class="submit-btn" onclick="publishQA()">🚀 Publish to Community Feed</button>
                </div>
            </div>

            <div class="feed-container" id="qa-feed">
                <!-- Q&A Feed -->
            </div>
        </div>

        <!-- TAB 2: STORY CORNER -->
        <div id="story-tab" class="tab-content">
            <div class="card">
                <h2>✍️ Share Your Student Story</h2>
                <div class="form-group">
                    <label for="story-name">Your Name:</label>
                    <input type="text" id="story-name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="story-title">Story Title:</label>
                    <input type="text" id="story-title" placeholder="e.g., My Study Routine Experience">
                </div>
                <div class="form-group">
                    <label for="story-content">Your Story / Experience:</label>
                    <textarea id="story-content" placeholder="Share your thoughts or experiences here..."></textarea>
                </div>
                <button class="submit-btn" onclick="publishStory()">Publish Story</button>
            </div>

            <div class="feed-container" id="story-feed">
                <!-- Story Feed -->
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadQAPosts();
            loadStoryPosts();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if(tabName === 'qa') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('qa-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('story-tab').classList.add('active');
            }
        }

        function generateAIAnswer() {
            const title = document.getElementById('qa-title').value.trim();
            if(!title) {
                alert("Please enter a question or topic first!");
                return;
            }

            document.getElementById('qa-summary').value = `⚡ Super Fast Summary for "${title}":\nThis topic gives you the foundational superpowers and core concepts designed for lightning-fast student revision!`;
            document.getElementById('qa-def').value = `📖 Key Definition & Terms:\nCore Subject: ${title}\nDefinition: The fundamental building block that explains essential rules, principles, and terminologies in a fun way.`;
            document.getElementById('qa-detail').value = `🔍 Detailed Step-by-Step Explanation:\n1. Introduction and core background context of ${title}.\n2. Important characteristics and real-world working principles.\n3. Amazing practical applications and future importance!`;

            document.getElementById('ai-result-area').style.display = 'block';
        }

        function publishQA() {
            const name = document.getElementById('qa-name').value.trim();
            const title = document.getElementById('qa-title').value.trim();
            const summary = document.getElementById('qa-summary').value.trim();
            const def = document.getElementById('qa-def').value.trim();
            const detail = document.getElementById('qa-detail').value.trim();

            if(!name || !title) {
                alert("Please enter your name and topic!");
                return;
            }

            const post = { name, title, summary, def, detail, date: new Date().toLocaleDateString() };
            let qaPosts = JSON.parse(localStorage.getItem('qaPosts') || '[]');
            qaPosts.unshift(post);
            localStorage.setItem('qaPosts', JSON.stringify(qaPosts));

            document.getElementById('qa-name').value = '';
            document.getElementById('qa-title').value = '';
            document.getElementById('ai-result-area').style.display = 'none';

            loadQAPosts();
        }

        function loadQAPosts() {
            const feed = document.getElementById('qa-feed');
            let qaPosts = JSON.parse(localStorage.getItem('qaPosts') || '[]');

            if(qaPosts.length === 0) {
                feed.innerHTML = '<div class="post-card empty-msg">🌟 No AI Q&A posts published yet. Be the first to ask a question above!</div>';
                return;
            }

            feed.innerHTML = qaPosts.map(p => `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-author">👤 ${escapeHTML(p.name)}</span>
                        <span style="color: #64748b; font-size: 0.9rem; font-weight: 600;">📅 ${p.date}</span>
                    </div>
                    <h3 class="post-title">💡 Q: ${escapeHTML(p.title)}</h3>
                    
                    <div class="fun-boxes-container">
                        ${p.summary ? `
                            <div class="box-summary">
                                <div class="box-heading">⚡ 1. Quick Summary / Short Notes</div>
                                <div class="box-content">${escapeHTML(p.summary)}</div>
                            </div>` : ''}

                        ${p.def ? `
                            <div class="box-def">
                                <div class="box-heading">📖 2. Definitions & Key Terms</div>
                                <div class="box-content">${escapeHTML(p.def)}</div>
                            </div>` : ''}

                        ${p.detail ? `
                            <div class="box-detail">
                                <div class="box-heading">🔍 3. Detailed Explanation</div>
                                <div class="box-content">${escapeHTML(p.detail)}</div>
                            </div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function publishStory() {
            const name = document.getElementById('story-name').value.trim();
            const title = document.getElementById('story-title').value.trim();
            const content = document.getElementById('story-content').value.trim();

            if(!name || !title || !content) {
                alert("Please fill in all story fields!");
                return;
            }

            const post = { name, title, content, date: new Date().toLocaleDateString() };
            let storyPosts = JSON.parse(localStorage.getItem('storyPosts') || '[]');
            storyPosts.unshift(post);
            localStorage.setItem('storyPosts', JSON.stringify(storyPosts));

            document.getElementById('story-name').value = '';
            document.getElementById('story-title').value = '';
            document.getElementById('story-content').value = '';

            loadStoryPosts();
        }

        function loadStoryPosts() {
            const feed = document.getElementById('story-feed');
            let storyPosts = JSON.parse(localStorage.getItem('storyPosts') || '[]');

            if(storyPosts.length === 0) {
                feed.innerHTML = '<div class="post-card empty-msg">🌟 No stories shared yet. Share your experience!</div>';
                return;
            }

            feed.innerHTML = storyPosts.map(p => `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-author">✍️ ${escapeHTML(p.name)}</span>
                        <span style="color: #64748b; font-size: 0.9rem; font-weight: 600;">📅 ${p.date}</span>
                    </div>
                    <h3 class="post-title">${escapeHTML(p.title)}</h3>
                    <div class="story-text">${escapeHTML(p.content)}</div>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
