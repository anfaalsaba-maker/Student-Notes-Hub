<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study & Story Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #fff;
        }
        button {
            background-color: #10b981;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #059669;
        }
        .feed-header {
            margin-top: 40px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .post-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 5px solid #3b82f6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .post-header {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .post-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .post-story {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            font-style: italic;
            color: #475569;
            margin-bottom: 15px;
            border-left: 3px solid #cbd5e1;
        }
        .section-box {
            background: #fdf4ff;
            border: 1px solid #f5d0fe;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }
        .section-box.definitions {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        .section-box.details {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .section-title {
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: #6b21a8;
        }
        .definitions .section-title { color: #1e40af; }
        .details .section-title { color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Student Study & Story Hub</h1>
    <p class="subtitle">Share your stories, notes, and get structured answers!</p>

    <!-- Post Creation Form -->
    <div class="form-group">
        <label for="authorName">Your Name:</label>
        <input type="text" id="authorName" placeholder="Enter your name">
    </div>

    <div class="form-group">
        <label for="postTitle">Topic / Question Title:</label>
        <input type="text" id="postTitle" placeholder="e.g., Data Science Basics or Calculus Problem">
    </div>

    <div class="form-group">
        <label for="postStory">Your Story or Question Details (Optional):</label>
        <textarea id="postStory" rows="2" placeholder="Write any story, thought or background context here..."></textarea>
    </div>

    <div class="form-group">
        <label for="shortNotes">1. Quick Summary / Short Notes:</label>
        <textarea id="shortNotes" rows="2" placeholder="Write crisp short notes..."></textarea>
    </div>

    <div class="form-group">
        <label for="definitions">2. Definitions & Key Terms:</label>
        <textarea id="definitions" rows="2" placeholder="Write core definitions here..."></textarea>
    </div>

    <div class="form-group">
        <label for="detailedAnswer">3. Detailed Explanation:</label>
        <textarea id="detailedAnswer" rows="3" placeholder="Provide complete detailed explanation..."></textarea>
    </div>

    <button onclick="addPost()">Publish Post & Structured Notes</button>

    <div class="feed-header">
        <h2>Community Feed</h2>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by topic or author name..." onkeyup="filterPosts()">
    </div>

    <div id="feedContainer"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", displayPosts);

    function addPost() {
        const name = document.getElementById('authorName').value.trim();
        const title = document.getElementById('postTitle').value.trim();
        const story = document.getElementById('postStory').value.trim();
        const shortNotes = document.getElementById('shortNotes').value.trim();
        const definitions = document.getElementById('definitions').value.trim();
        const detailedAnswer = document.getElementById('detailedAnswer').value.trim();

        if (!name || !title) {
            alert("Please fill in at least your name and title!");
            return;
        }

        const newPost = {
            id: Date.now(),
            name: name,
            title: title,
            story: story,
            shortNotes: shortNotes,
            definitions: definitions,
            detailedAnswer: detailedAnswer,
            date: new Date().toLocaleDateString()
        };

        let posts = JSON.parse(localStorage.getItem('studyHubPosts')) || [];
        posts.unshift(newPost);
        localStorage.setItem('studyHubPosts', JSON.stringify(posts));

        // Clear inputs
        document.getElementById('postTitle').value = '';
        document.getElementById('postStory').value = '';
        document.getElementById('shortNotes').value = '';
        document.getElementById('definitions').value = '';
        document.getElementById('detailedAnswer').value = '';

        displayPosts();
    }

    function displayPosts(filter = '') {
        const feedContainer = document.getElementById('feedContainer');
        feedContainer.innerHTML = '';

        let posts = JSON.parse(localStorage.getItem('studyHubPosts')) || [];

        if (posts.length === 0) {
            feedContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">No posts yet. Be the first to share something!</p>';
            return;
        }

        posts.forEach(post => {
            if (filter && !post.title.toLowerCase().includes(filter.toLowerCase()) && !post.name.toLowerCase().includes(filter.toLowerCase())) {
                return;
            }

            const card = document.createElement('div');
            card.className = 'post-card';

            let storyHtml = post.story ? `<div class="post-story">"${post.story}"</div>` : '';
            let shortHtml = post.shortNotes ? `<div class="section-box"><div class="section-title">⚡ Quick Summary</div><p>${post.shortNotes}</p></div>` : '';
            let defHtml = post.definitions ? `<div class="section-box definitions"><div class="section-title">📖 Definitions & Key Terms</div><p>${post.definitions}</p></div>` : '';
            let detailHtml = post.detailedAnswer ? `<div class="section-box details"><div class="section-title">🔍 Detailed Explanation</div><p>${post.detailedAnswer}</p></div>` : '';

            card.innerHTML = `
                <div class="post-header">By: <strong>${post.name}</strong> | Date: ${post.date}</div>
                <div class="post-title">${post.title}</div>
                ${storyHtml}
                ${shortHtml}
                ${defHtml}
                ${detailHtml}
            `;
            feedContainer.appendChild(card);
        });
    }

    function filterPosts() {
        const query = document.getElementById('searchInput').value;
        displayPosts(query);
    }
</script>

</body>
</html>
