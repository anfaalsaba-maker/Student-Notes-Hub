<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Smart Student Portal & Q&A Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Welcome Screen */
    #welcome-screen {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    #welcome-screen h2 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #welcome-screen p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.8);
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    /* Main Portal Dashboard */
    #main-portal {
      display: none;
      width: 100%;
      max-width: 920px;
      background: rgba(30, 41, 59, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 20px;
    }

    .user-badge h3 {
      font-size: 18px;
      color: #38bdf8;
    }

    .user-badge span {
      font-size: 13px;
      color: #cbd5e1;
    }

    .btn-lock {
      padding: 8px 14px;
      background: rgba(244, 114, 182, 0.2);
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.4);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    /* Navigation Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
