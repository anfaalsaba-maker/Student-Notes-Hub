<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Q&A & Challenge Hub</title>
    <style>
        :root {
            --primary: #db2777; /* Deep Pink */
            --primary-hover: #be185d; /* Darker Pink */
            --bg-color: #fdf2f8; /* Very Light Pink Background */
            --card-bg: #ffffff;
            --text-color: #831843; /* Dark Pink/Berry Text */
            --text-light: #9d174d;
            --border-color: #f472b6; /* Pink Border */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 2.2rem;
        }

        header p {
            color: #db2777;
            font-size: 1rem;
            font-weight: 600;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 22px;
            background-color: #fce7f3;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #be185d;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.4);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Card */
        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.1);
            margin-bottom: 25px;
            border: 2px solid #fbcfe8;
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #9d174d;
            font-size: 0.95rem;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #f472b6;
            border-radius: 12px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            background-color: #fff1f2;
            color: #831843;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .ai-btn {
            background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);
        }

        .ai-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Feed & Post Cards */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
