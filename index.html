<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Q&A & Challenge Hub - Ultimate Pro</title>
    <style>
        :root {
            --primary: #db2777;
            --primary-hover: #be185d;
            --bg-color: #fdf2f8;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #831843;
            --text-light: #9d174d;
            --border-color: #f472b6;
            --btn-gradient: linear-gradient(135deg, #db2777 0%, #be185d 100%);
            --shadow: 0 10px 30px -5px rgba(219, 39, 119, 0.15);
        }

        [data-theme="boy"] {
            --primary: #06b6d4;
            --primary-hover: #0891b2;
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --text-color: #f8fafc;
            --text-light: #94a3b8;
            --border-color: #3b82f6;
            --btn-gradient: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            --shadow: 0 10px 30px -5px rgba(6, 182, 212, 0.25);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            transition: background-color 0.4s, color 0.4s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .welcome-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .welcome-card h2 {
            color: #06b6d4;
            margin-top: 0;
            font-size: 1.7rem;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .welcome-card input, .welcome-card select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            color: #ffffff;
            background: rgba(30, 41, 59, 0.6);
        }

        #auto-detect-badge {
            display: block;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            transition: all 0.3s;
        }

        .enter-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s;
        }

        .enter-btn:hover {
            transform: scale(1.02);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        header p {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .live-visitor-bar {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 14px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 18px;
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-color);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 22px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .submit-btn, .ai-btn {
            background: var(--btn-gradient);
            color: white;
            border: none;
            padding: 11px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: var(--shadow);
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border-color);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            font-size: 0.9rem;
        }

        .post-author {
            font-weight: 700;
            color: var(--primary);
        }

        .post-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--text-color);
        }

        .box-summary, .box-def, .box-detail, .story-text {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 10px;
        }

        .box-heading {
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .box-content, .story-text {
            color: var(--text-color);
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-line;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: 25px;
        }

        .visitor-item {
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 8px;
            margin: 4px 0;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        /* Fun Grid Buttons for Chill Mode */
        .chill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .chill-option-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid var(--border-color);
            padding: 12px;
            border-radius: 14px;
            color: var(--text-color);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .chill-option-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        #fun-output-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed var(--border-color);
            padding: 20px;
            border-radius: 16px;
            margin-top: 15px;
            text-align: center;
            font-size: 1rem;
            color: var(--text-color);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-card">
            <h2>✨ AI Smart Student Portal</h2>
            <p>Enter details & pick your study vibe to unlock:</p>
            
            <input type="text" id="user-name-input" placeholder="Enter your full name..." oninput="realTimeAutoDetect(this.value)">
            <input type="number" id="user-age-input" placeholder="Enter your age..." min="5" max="50">
            
            <select id="user-class-select">
    <option value="">-- Select Your Class / Level --</option>
    <option value="Primary (Class 1-5)">Primary (Class 1-5)</option>
    <option value="Middle (Class 6-8)">Middle (Class 6-8)</option>
    <option value="Matric (Class 9-10)">Matric (Class 9-10)</option>
    <option value="Intermediate">Intermediate</option>
    <option value="BS Data Science / University">BS Data Science / University</option>
</select>
<button type="button" style="width: 100%; padding: 12px; margin-top: 15px; background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">Unlock Portal</button>
