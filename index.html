<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Q&A & Student Story Hub</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            padding: 10px 25px;
            background-color: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-light);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Card */
        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #059669;
        }

        .ai-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .ai-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Feed & Post Cards */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .post-author {
            font-weight: bold;
            color: var(--primary);
        }

        .post-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            color: var(--text-color);
        }

        /* 3-Column Grid for the 3 Boxes */
        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .boxes-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Stylish Colored Boxes */
        .box-summary {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-top: 5px solid #3b82f6;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.05);
        }

        .box-def {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 1px solid #bbf7d0;
            border-top: 5px solid #22c55e;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.05);
        }

        .box-detail {
            background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%);
            border: 1px solid #f5d0fe;
            border-top: 5px solid #a855f7;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 4px rgba(168, 85, 247, 0.05);
        }

        .box-heading {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box-summary .box-heading { color: #1d4ed8; }
        .box-def .box-heading { color: #15803d; }
        .box-detail .box-heading { color: #7e22ce; }

        .box-content {
            color: #334155;
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-line;
        }

        .story-text {
            background-color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            border-left: 5px solid #f59e0b;
            color: #334155;
            line-height: 1.6;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🤖 Smart AI Q&A & Student Story Hub</h1>
            <p>Ask any question and let AI generate side-by-side colorful answers instantly!</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('qa')">💡 AI Q&A Portal</button>
            <button class="tab-btn" onclick="switchTab('story')">✍️ Share Story</button>
        </div>

        <!-- TAB 1: AI Q&A PORTAL -->
        <div id="qa-tab" class="tab-content active">
            <div class="card">
                <h2>Ask Question & Generate AI Answer</h2>
                <div class="form-group">
                    <label for="qa-name">Your Name:</label>
                    <input type="text" id="qa-name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="qa-title">Question / Topic:</label>
                    <input type="text" id="qa-title" placeholder="e.g., Python Libraries, Limits in Calculus">
                </div>
                <button class="ai-btn" onclick="generateAIAnswer()">✨ Generate Smart AI Answer</button>

                <div id="ai-result-area" style="margin-top: 25px; display: none;">
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 20px;">
                    <h3 style="color: #059669; margin-bottom: 15px;">Generated AI Structured Answer:</h3>
                    
                    <div class="form-group">
                        <label>1. Quick Summary / Short Notes:</label>
                        <textarea id="qa-summary"></textarea>
                    </div>
                    <div class="form-group">
                        <label>2. Definitions & Key Terms:</label>
                        <textarea id="qa-def"></textarea>
                    </div>
                    <div class="form-group">
                        <label>3. Detailed Explanation:</label>
                        <textarea id="qa-detail"></textarea>
                    </div>
                    <button class="submit-btn" onclick="publishQA()">🚀 Publish to Community Feed</button>
                </div>
            </div>

            <div class="feed-container" id="qa-feed">
                <!-- Q&A Feed -->
            </div>
        </div>

        <!-- TAB 2: STORY CORNER -->
        <div id="story-tab" class="tab-content">
            <div class="card">
                <h2>Share Your Student Story</h2>
                <div class="form-group">
                    <label for="story-name">Your Name:</label>
                    <input type="text" id="story-name" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="story-title">Story Title:</label>
                    <input type="text" id="story-title" placeholder="e.g., My Study Routine Experience">
                </div>
                <div class="form-group">
                    <label for="story-content">Your Story / Experience:</label>
                    <textarea id="story-content" placeholder="Share your thoughts or experiences here..."></textarea>
                </div>
                <button class="submit-btn" onclick="publishStory()">Publish Story</button>
            </div>

            <div class="feed-container" id="story-feed">
                <!-- Story Feed -->
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadQAPosts();
            loadStoryPosts();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if(tabName === 'qa') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('qa-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('story-tab').classList.add('active');
            }
        }

        function generateAIAnswer() {
            const title = document.getElementById('qa-title').value.trim();
            if(!title) {
                alert("Please enter a question or topic first!");
                return;
            }

            document.getElementById('qa-summary').value = `This is a crisp and clear summary of "${title}". Designed for quick student revision.`;
            document.getElementById('qa-def').value = `Key Term: ${title}\nDefinition: A fundamental concept explaining core principles and essential elements.`;
            document.getElementById('qa-detail').value = `Comprehensive explanation regarding "${title}":\n1. Introduction.\n2. Key characteristics.\n3. Practical applications.`;

            document.getElementById('ai-result-area').style.display = 'block';
        }

        function publishQA() {
            const name = document.getElementById('qa-name').value.trim();
            const title = document.getElementById('qa-title').value.trim();
            const summary = document.getElementById('qa-summary').value.trim();
            const def = document.getElementById('qa-def').value.trim();
            const detail = document.getElementById('qa-detail').value.trim();

            if(!name || !title) {
                alert("Please enter your name and topic!");
                return;
            }

            const post = { name, title, summary, def, detail, date: new Date().toLocaleDateString() };
            let qaPosts = JSON.parse(localStorage.getItem('qaPosts') || '[]');
            qaPosts.unshift(post);
            localStorage.setItem('qaPosts', JSON.stringify(qaPosts));

            document.getElementById('qa-name').value = '';
            document.getElementById('qa-title').value = '';
            document.getElementById('ai-result-area').style.display = 'none';

            loadQAPosts();
        }

        function loadQAPosts() {
            const feed = document.getElementById('qa-feed');
            let qaPosts = JSON.parse(localStorage.getItem('qaPosts') || '[]');

            if(qaPosts.length === 0) {
                feed.innerHTML = '<div class="post-card empty-msg">No AI Q&A posts published yet. Ask a question above!</div>';
                return;
            }

            feed.innerHTML = qaPosts.map(p => `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-author">👤 ${escapeHTML(p.name)}</span>
                        <span style="color: #64748b; font-size: 0.85rem;">📅 ${p.date}</span>
                    </div>
                    <h3 class="post-title">💡 Q: ${escapeHTML(p.title)}</h3>
                    
                    <div class="boxes-grid">
                        ${p.summary ? `
                            <div class="box-summary">
                                <div class="box-heading">⚡ 1. Summary</div>
                                <div class="box-content">${escapeHTML(p.summary)}</div>
                            </div>` : ''}

                        ${p.def ? `
                            <div class="box-def">
                                <div class="box-heading">📖 2. Definitions</div>
                                <div class="box-content">${escapeHTML(p.def)}</div>
                            </div>` : ''}

                        ${p.detail ? `
                            <div class="box-detail">
                                <div class="box-heading">🔍 3. Details</div>
                                <div class="box-content">${escapeHTML(p.detail)}</div>
                            </div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function publishStory() {
            const name = document.getElementById('story-name').value.trim();
            const title = document.getElementById('story-title').value.trim();
            const content = document.getElementById('story-content').value.trim();

            if(!name || !title || !content) {
                alert("Please fill in all story fields!");
                return;
            }

            const post = { name, title, content, date: new Date().toLocaleDateString() };
            let storyPosts = JSON.parse(localStorage.getItem('storyPosts') || '[]');
            storyPosts.unshift(post);
            localStorage.setItem('storyPosts', JSON.stringify(storyPosts));

            document.getElementById('story-name').value = '';
            document.getElementById('story-title').value = '';
            document.getElementById('story-content').value = '';

            loadStoryPosts();
        }

        function loadStoryPosts() {
            const feed = document.getElementById('story-feed');
            let storyPosts = JSON.parse(localStorage.getItem('storyPosts') || '[]');

            if(storyPosts.length === 0) {
                feed.innerHTML = '<div class="post-empty-msg">No stories shared yet. Share your experience!</div>';
                return;
            }

            feed.innerHTML = storyPosts.map(p => `
                <div class="post-card">
                    <div class="post-header">
                        <span class="post-author">✍️ ${escapeHTML(p.name)}</span>
                        <span style="color: #64748b; font-size: 0.85rem;">📅 ${p.date}</span>
                    </div>
                    <h3 class="post-title">${escapeHTML(p.title)}</h3>
                    <div class="story-text">${escapeHTML(p.content)}</div>
                </div>
            `).join('');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
